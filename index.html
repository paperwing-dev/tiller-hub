<!doctype html>
<html lang="en" data-mode="light" data-theme="paperwing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiller</title>
    <script>
      // Set the theme before the app bundle loads to avoid a first-paint flash.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("tiller-theme");
        } catch (e) {}
        document.documentElement.dataset.mode = "light";
        document.documentElement.dataset.theme =
          pref === "classic-light" ? "classic-light" : "paperwing";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
